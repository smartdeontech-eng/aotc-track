<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D3F94">
<link rel="icon" href="/img/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<title>Meeting Minutes — AOTC Track</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/vendor/glass/glass.css">
<style>
  .sec{border:1px solid var(--line,#d5dae6);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
  .sec-head{display:flex;gap:10px;align-items:baseline;margin-bottom:8px;}
  .sec-no{font:700 12px ui-monospace,monospace;background:rgba(29,63,148,.12);color:#1D3F94;border-radius:6px;padding:2px 7px;}
  .sec-title{font-weight:700;font-size:15px;}
  .auto{font-size:13.5px;background:rgba(29,63,148,.06);border-radius:8px;padding:8px 10px;margin:0 0 8px;}
  .auto.missing{background:rgba(200,140,20,.12);}
  .child{border-left:3px solid rgba(29,63,148,.35);padding:8px 0 8px 12px;margin:10px 0;}
  .child .tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .fix{display:grid;grid-template-columns:1fr auto 1fr auto;gap:8px;align-items:center;margin:6px 0;}
  @media (max-width:640px){ .fix{grid-template-columns:1fr;} }
  .names{font-size:12.5px;opacity:.8;margin:2px 0 0;}
  .final-note{background:rgba(20,140,90,.12);color:#136b47;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:12px;}
  .mtabs{display:flex;gap:2px;border-bottom:1px solid var(--line,#d5dae6);margin-bottom:14px;overflow-x:auto;}
  .mtab{border:0;background:transparent;color:inherit;font:inherit;font-weight:600;font-size:13.5px;padding:9px 14px;cursor:pointer;opacity:.7;border-bottom:2px solid transparent;white-space:nowrap;}
  .mtab.active{opacity:1;border-bottom-color:#1D3F94;color:#1D3F94;}
  .pane{display:none;} .pane.active{display:block;}
  .roll-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line,#e6e9f0);flex-wrap:wrap;}
  .roll-row .who{flex:1;min-width:180px;} .roll-row .who span{display:block;font-size:11.5px;opacity:.65;}
  .seg{display:flex;gap:4px;}
  .seg button{border:1px solid var(--line,#d5dae6);background:transparent;color:inherit;font:inherit;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:7px;cursor:pointer;}
  .seg button.on{background:#1D3F94;border-color:#1D3F94;color:#fff;}
  .seg button.on.apo{background:#8a6100;border-color:#8a6100;}
  .seg button.on.abs{background:#59617a;border-color:#59617a;}
  .counts{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 10px;} .counts b{font-size:18px;display:block;}
  .ag-row{display:flex;gap:6px;align-items:center;margin:6px 0;} .ag-row input{flex:1;}
  .pfields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:0 0 8px;}
  .pfields label{font-size:12px;font-weight:600;display:block;margin-bottom:3px;}
</style>
<script src="/js/theme-init.js"></script>
</head>
<body>
  <div class="shell">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div class="page-header">
        <div>
          <h1 id="title">Minutes</h1>
          <div class="sub" id="subtitle"></div>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <a class="btn btn-secondary" href="/meetings.html">‹ Meetings</a>
          <span class="muted" id="saveNote"></span>
        </div>
      </div>
      <div id="finalNote"></div>
      <div class="mtabs">
        <button class="mtab active" data-pane="roll">Roll</button>
        <button class="mtab" data-pane="agenda">Agenda</button>
        <button class="mtab" data-pane="minutes">Minutes</button>
        <button class="mtab" data-pane="docs">Documents</button>
      </div>
      <div class="pane active" id="pane-roll"><div id="rollBox"></div></div>
      <div class="pane" id="pane-agenda"><div id="agendaBox"></div></div>
      <div class="pane" id="pane-minutes"><div id="body"></div></div>
      <div class="pane" id="pane-docs">
        <div class="card" id="docsCard">
          <h3 style="margin-top:0;">Download</h3>
          <p class="sub">Built from the Roll and the Minutes, in the same layout as the Session's minutes.</p>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <a class="btn btn-primary btn-sm" id="dlDocx" href="#">Minutes (Word)</a>
            <a class="btn btn-secondary btn-sm" id="dlPdf" href="#" target="_blank">Minutes (PDF)</a>
          </div>
        </div>
        <div class="card" style="margin-top:12px;">
          <h3 style="margin-top:0;">Signed copy</h3>
          <div id="signedBox"></div>
          <input type="file" id="signedIn" accept="application/pdf" style="display:none;">
        </div>
        <div class="card" style="margin-top:12px;">
          <h3 style="margin-top:0;">Status</h3>
          <p class="sub" id="statusText" style="margin-top:0;"></p>
          <button class="btn btn-primary btn-sm" id="finalBtn">Mark as final</button>
          <button class="btn btn-secondary btn-sm" id="reopenBtn" style="display:none;">Reopen for editing</button>
        </div>
      </div>
    </div>
  </div>
  <div class="tabbar" id="tabbar"></div>
  <script src="/js/app.js"></script>
  <script src="/js/page-meeting-minutes.js"></script>
<script src="/vendor/glass/glass.js" defer></script>
</body>
</html>
