<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1D3F94">
<link rel="icon" href="/img/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<title>Report — AOTC Track</title>
<style>
  body { font-family: 'Times New Roman', serif; font-size: 12pt; color: #000; max-width: 820px; margin: 24px auto; padding: 0 16px; }
  .center { text-align: center; } .b { font-weight: bold; }
  h3 { font-size: 12pt; margin: 18px 0 6px; }
  p { margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0 14px; }
  th, td { border: 1px solid #000; padding: 5px 7px; font-size: 10pt; vertical-align: top; text-align: left; }
  th { background: #eef1f7; }
  .sig td { border: none; padding: 3px 7px; font-size: 12pt; }
  .noprint { text-align: center; margin: 14px 0; }
  .noprint button { font-size: 14px; padding: 8px 18px; cursor: pointer; }
  ol { margin: 0 0 12px 22px; padding: 0; } ol li { margin-bottom: 2px; }
  @media print {
    .noprint { display: none; }
    body { margin: 0; max-width: 100%; }
    table, tr { page-break-inside: avoid; }
    th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <div class="noprint"><button onclick="window.print()">🖨 Print / Save as PDF</button></div>
  <div id="doc">Loading…</div>
<script>
function esc(s) { const d = document.createElement('div'); d.textContent = s === null || s === undefined ? '' : String(s); return d.innerHTML; }
function fmtVal(v, unit) {
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'number') {
    if ((unit || '') === '%') return (Math.abs(v) <= 1 ? v * 100 : v).toFixed(1).replace(/\.0$/, '');
    return v.toLocaleString();
  }
  return String(v);
}
(async () => {
  const r = await fetch('/api/reports/data' + location.search, { credentials: 'same-origin' });
  if (!r.ok) { document.getElementById('doc').textContent = (await r.json()).error || 'Not available'; return; }
  const d = await r.json();
  const sigs = d.entity.signatories || {};
  const sec = sigs.secretary || sigs.assistant || {}; const head = sigs.head || {};
  const isCom = d.isCommittee;
  const members = [...d.members].sort((a, b) => (a.position === 'Member') - (b.position === 'Member'));
  const dt = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  let h = '';
  h += `<p class="center b">PRESBYTERIAN CHURCH OF GHANA</p>`;
  h += `<p class="center b">ADABRAKA OFFICIAL TOWN CONGREGATION</p>`;
  h += `<p class="center b">${isCom ? 'COMMITTEE ON ' : ''}${esc(d.entity.name.toUpperCase())}</p>`;
  h += `<p class="center b" style="margin-bottom:22px;">${d.ordinal.toUpperCase()} QUARTER REPORT FOR YEAR ${d.year}</p>`;
  h += `<h3>Preamble</h3><p>${esc(d.narrative.preamble || '—')}</p>`;
  h += `<h3>${isCom ? 'Membership' : 'Executives'}</h3>`;
  if (isCom) h += `<p>Committee Membership – ${d.members.length}</p>`;
  h += `<table style="max-width:480px;"><thead><tr><th style="width:34px;">No.</th><th>Name</th><th style="width:150px;">Position</th></tr></thead><tbody>${members.map((m, i) => `<tr><td>${i + 1}</td><td>${esc(m.name)}</td><td>${esc(m.position || 'Member')}${m.coopted ? ' (co-opted)' : ''}</td></tr>`).join('')}</tbody></table>`;
  h += `<h3>Notable Achievements and Events</h3><p>${esc(d.narrative.achievements || 'None.')}</p>`;
  h += `<h3>Major Challenges</h3><p>${esc(d.narrative.challenges || 'There were no challenges in the quarter under review.')}</p>`;
  if (d.narrative.recommendations) h += `<h3>Recommendations</h3><p>${esc(d.narrative.recommendations)}</p>`;
  h += `<table class="sig"><tr><td class="b">Signed</td><td class="b">Signed</td></tr>
    <tr><td>${esc(sec.name || '____________________')}</td><td>${esc(head.name || '____________________')}</td></tr>
    <tr><td>(${esc(sec.title || 'Secretary')})</td><td>(${esc(head.title || (isCom ? 'Chairperson' : 'President'))})</td></tr>
    <tr><td>${dt}</td><td>${dt}</td></tr></table>`;
  h += `<p class="center b" style="margin-top:24px;">TABLES</p>`;
  h += `<h3>Table 1.0: Quarterly KPI Update</h3><table><thead><tr>
    <th>Code</th><th>Goals</th><th>Key Performance Indicators (KPI)</th><th>Unit</th>
    <th>Prev. Year Actual</th><th>Current Year Target</th><th>1st</th><th>2nd</th><th>3rd</th><th>4th</th></tr></thead><tbody>`;
  d.kpiTable.forEach(r2 => {
    h += `<tr><td>${esc(r2.code)}</td><td>${esc(r2.goal)}</td><td>${esc(r2.kpi)}</td><td>${esc(r2.unit)}</td>
      <td>${fmtVal(r2.prevActual, r2.unit)}</td><td>${fmtVal(r2.target, r2.unit)}</td>
      ${r2.quarters.map(q => `<td>${fmtVal(q, r2.unit)}</td>`).join('')}</tr>`;
  });
  h += `</tbody></table>`;
  h += `<h3>Table 2 – ${isCom ? 'Committee' : 'Group'} Quarterly Performance</h3>`;
  let i = 0;
  const actTable = list => `<table><thead><tr><th>No</th><th>Strategies/Activities</th><th>Targets Performance</th><th>Actual Performance</th><th>Remarks</th></tr></thead>
    <tbody>${list.map((a, j) => `<tr><td>${j + 1}</td><td>${esc(a.description)}</td><td>${esc(a.target)}</td><td>${esc(a.actual)}</td><td>${esc(a.remarks)}</td></tr>`).join('')}</tbody></table>`;
  d.goalSections.forEach(s2 => {
    i += 1;
    h += `<h3>Table 2.${i}</h3><table><tr><th style="width:15%;">Code</th><th>Goal</th></tr>
      <tr><td>${esc(s2.code)}</td><td>${esc(s2.description)}</td></tr></table>`;
    h += actTable(s2.activities);
  });
  if (d.generalActivities.length) { i += 1; h += `<h3>Table 2.${i} — Other Activities</h3>` + actTable(d.generalActivities); }
  document.getElementById('doc').innerHTML = h;
  document.title = `${d.entity.name} — Q${d.quarter} ${d.year} Report`;
})();
</script>
</body>
</html>
