<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1D3F94">
<link rel="icon" href="/img/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<title>Reset password — AOTC Track</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/vendor/glass/glass.css">
<script src="/js/theme-init.js"></script>
</head>
<body>
  <div class="login-shell">
    <div class="login-wrap">
      <div class="login-card">
        <img src="/img/logo.png" alt="AOTC Track" style="height:38px; margin-bottom:16px;">
        <div class="brand">Reset your password</div>
        <div class="brand-sub">Choose a new password for your account</div>

        <form id="resetForm">
          <div class="field">
            <label>New password</label>
            <input type="password" id="newPassword" required minlength="10">
            <div id="pwMeter" style="margin-top:8px;"></div>
          </div>
          <div class="field">
            <label>Confirm new password</label>
            <input type="password" id="confirmPassword" required minlength="10">
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">Set new password</button>
          <div class="login-error" id="error"></div>
        </form>
        <div id="successMsg" style="display:none;">
          <p class="sub">Your password has been reset. <a href="/login.html">Return to log in</a>.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/page-reset-password.js"></script>
<script src="/vendor/glass/glass.js" defer></script>
</body>
</html>
