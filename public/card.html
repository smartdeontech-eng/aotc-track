<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1D3F94">
<link rel="icon" href="/img/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<title>My Member Card — AOTC Track</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/vendor/glass/glass.css">
<style>
  /* Standalone page (no app shell / no login). */
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--primary-gradient); padding: 20px; }
  .mcard { background: #fff; width: 100%; max-width: 360px; border-radius: 18px;
           box-shadow: 0 20px 60px rgba(4,16,38,.35); overflow: hidden; text-align: center; }
  .mcard-head { background: var(--primary-gradient); color: #fff; padding: 18px 20px; }
  .mcard-head img { height: 46px; width: auto; background: #fff; border-radius: 10px; padding: 5px; }
  .mcard-head .org { font-size: 12.5px; margin-top: 8px; opacity: .92; letter-spacing: .02em; }
  .mcard-body { padding: 22px 22px 26px; }
  .mcard .name { font-family: 'Geist', sans-serif; font-weight: 800; font-size: 20px; color: var(--ink); }
  .mcard .pos { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .mcard .qr { margin: 18px auto 10px; width: 220px; height: 220px; display: block; }
  .mcard .no { font-family: 'Geist Mono', monospace; font-size: 15px; color: var(--ink); letter-spacing: .04em; }
  .mcard .no b { font-weight: 600; }
  .mcard .hint { font-size: 12px; color: var(--muted); margin-top: 16px; line-height: 1.5; }
  .mcard .err { padding: 30px 24px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .mcard .entity { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
  <div class="mcard" id="mcard">
    <div class="mcard-body"><p class="err">Loading your card…</p></div>
  </div>
  <script src="/js/page-card.js"></script>
<script src="/vendor/glass/glass.js" defer></script>
</body>
</html>
