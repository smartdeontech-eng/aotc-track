# AOTC Track — nginx reverse proxy config
#
# Where this goes: /etc/nginx/sites-available/aotc-track, then:
#   sudo ln -s /etc/nginx/sites-available/aotc-track /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Before this works you need:
#   1. A domain (e.g. track.pcg-aotc.com) pointed at this server's IP.
#   2. Certbot installed: sudo apt install certbot python3-certbot-nginx
#   3. Run this file FIRST with only the :80 server block (comment out the
#      :443 block below), then run:
#        sudo certbot --nginx -d track.pcg-aotc.com
#      Certbot will rewrite this file to add the :443 block and the
#      ssl_certificate lines automatically — the block below is a reference
#      for what that looks like, in case you're setting it up by hand.
#
# Replace every "track.pcg-aotc.com" below with your real domain.

# Hide nginx version from response headers and error pages.
server_tokens off;

# ---- Plain HTTP: redirect everything to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name track.pcg-aotc.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: reverse proxy to the Node app ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name track.pcg-aotc.com;

    ssl_certificate     /etc/letsencrypt/live/track.pcg-aotc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/track.pcg-aotc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Product/logo image uploads are capped at 3MB in the app (see
    # routes/products.js, routes/settings.js) — 5M leaves headroom without
    # letting arbitrarily large request bodies through.
    client_max_body_size 5M;

    # Standard reverse-proxy headers. X-Forwarded-For/Proto are what
    # server.js's `app.set('trust proxy', 1)` relies on to know the real
    # client IP and that the original request was HTTPS (needed for secure
    # cookies and the login-lockout-by-IP logic).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
